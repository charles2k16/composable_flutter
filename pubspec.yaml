name: composables_it_client
description: Composables IT Consult — Client Installment App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.3.3
  
  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_animate: ^4.3.0

  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.1
  pinput: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
